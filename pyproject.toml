[project]
name = "general-purpose-personality-plugin"
version = "0.1.0"
description = "Configurable character and expression rules for AstrBot private chat"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
